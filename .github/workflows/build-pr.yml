name: "🔍 CI · Pull Request"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearchha-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@1ebb6d9e98930d0ede2aaf9bf0c648010d44d66e
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
