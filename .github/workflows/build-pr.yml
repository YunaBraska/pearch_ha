name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pearchha-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@b469d48bd53ec336312b5d541e247c16c5fd0f2d
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
