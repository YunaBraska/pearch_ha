name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearchha-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@c50354ba274461b06a13b961d219629d3bb57ae2
    with:
      ref: ${{ github.sha }}
