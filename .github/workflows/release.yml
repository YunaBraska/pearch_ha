# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@b37f72aaab2392700a6085eb57a1cd96a73034fb
    with:
      force: ${{ inputs.force }}
      app_store_app_name: PearchHA
      app_store_bundle_id: berlin.yuna.pearchha
      macos_update_public_key: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
    secrets: inherit
