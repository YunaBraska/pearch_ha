name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (default: UTC date %Y.%m.%j%H%M)"
        required: false
        type: string
  # Temporary dry-run trigger while the workflow is verified from this branch:
  # a push builds, packages, and verifies everything but publishes nothing
  # (publish steps are gated on workflow_dispatch below).
  push:
    branches:
      - ui-dashboard-overhaul

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Generate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="$(date -u '+%Y.%m.%j%H%M')"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checks and tests
        run: sh scripts/check.sh

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree changed during checks."
            git status --short
            exit 1
          fi

      - name: Build universal release binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          swift run perchha-package-app \
            --executable .build/apple/Products/Release/PerchHA \
            --output build/PerchHA.app \
            --callback-scheme perchha \
            --replace \
            --version "${tag}" \
            --build-version "${tag}" \
            --sign-ad-hoc \
            --verify-signature \
            --package-dmg \
            --verify-dmg \
            --verify-dmg-contents \
            --release-manifest build/perchha-release-manifest.json \
            --bundle-release-evidence build/perchha-release-evidence \
            --oauth-site build/perchha-oauth-site/index.html \
            --snapshot-dir .build/perchha-snapshots/current
          swift run perchha-package-app \
            --verify-release-manifest build/perchha-release-manifest.json

      - name: Verify bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          plist="build/PerchHA.app/Contents/Info.plist"
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          b="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")"
          [[ "${v}" == "${{ steps.version.outputs.tag }}" ]]
          [[ "${b}" == "${{ steps.version.outputs.tag }}" ]]

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail
          bin="build/PerchHA.app/Contents/MacOS/PerchHA"
          lipo -info "${bin}"
          lipo -info "${bin}" | grep -q "arm64"
          lipo -info "${bin}" | grep -q "x86_64"

      - name: Verify code signature
        run: codesign --verify --deep --verbose=2 build/PerchHA.app

      - name: Zip app bundle
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -r --symlinks "PerchHA-${{ steps.version.outputs.tag }}.zip" PerchHA.app
          cp PerchHA.dmg "PerchHA-${{ steps.version.outputs.tag }}.dmg"

      - name: Compute SHA256 (for Homebrew)
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          zip="build/PerchHA-${{ steps.version.outputs.tag }}.zip"
          sha="$(shasum -a 256 "${zip}" | awk '{print $1}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PerchHA ${{ steps.version.outputs.tag }}
          body: |
            Automated build from ${{ github.sha }}.

            **Install:** download the zip, unzip, drag `PerchHA.app` to `/Applications`, then right-click → **Open** on first launch (not notarized).
          generate_release_notes: true
          files: |
            build/PerchHA-${{ steps.version.outputs.tag }}.zip
            build/PerchHA-${{ steps.version.outputs.tag }}.dmg
          draft: false
          prerelease: false

      - name: Checkout Homebrew tap
        if: ${{ github.event_name == 'workflow_dispatch' && env.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: YunaBraska/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        if: ${{ github.event_name == 'workflow_dispatch' && env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.tag }}"
          sha="${{ steps.sha.outputs.sha }}"

          cask="homebrew-tap/Casks/perchha.rb"
          mkdir -p "$(dirname "${cask}")"
          cat > "${cask}" <<EOF
          cask "perchha" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/YunaBraska/pearch_ha/releases/download/#{version}/PerchHA-#{version}.zip",
                verified: "github.com/YunaBraska/pearch_ha/"
            name "PerchHA"
            desc "macOS menu bar dashboard for Home Assistant"
            homepage "https://github.com/YunaBraska/pearch_ha"

            depends_on macos: ">= :ventura"

            app "PerchHA.app"
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/perchha.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git commit -m "perchha: ${version}"
          git push
