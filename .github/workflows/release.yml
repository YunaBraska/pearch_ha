name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (default: UTC date YYYY.M.D)"
        required: false
        type: string
      dry_run:
        description: "Build and package without creating a GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: "🛠️ Select Xcode"
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: "🔎 Toolchain versions"
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: "🩺 Verify Xcode setup"
        run: swift run pearchha-xcode-doctor --json --strict

      - name: "📋 List XCTest cases"
        run: swift test --disable-swift-testing --enable-xctest list

      - name: "🧭 Plan release"
        id: plan
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          publish=false
          dry_run=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish=true
          else
            dry_run="${INPUT_DRY_RUN}"
            if [[ "${dry_run}" != "true" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Non-dry-run manual releases must run from main." >&2
              exit 1
            fi
            if [[ "${dry_run}" != "true" ]]; then
              publish=true
            fi
          fi

          if [[ -n "${INPUT_VERSION}" ]]; then
            tag="${INPUT_VERSION}"
          else
            year="$(date -u +%Y)"
            month="$(date -u +%m | sed 's/^0//')"
            day="$(date -u +%d | sed 's/^0//')"
            tag="${year}.${month}.${day}"
          fi

          if ! [[ "${tag}" =~ ^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?$ ]]; then
            echo "Release version must look like 2026.7.11, got: ${tag}" >&2
            exit 1
          fi

          if [[ "${publish}" == "true" ]]; then
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Release tag already exists: ${tag}" >&2
              exit 1
            fi
          fi

          artifact_suffix="${tag}"
          if [[ "${dry_run}" == "true" ]]; then
            artifact_suffix="${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_ID}"
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${artifact_suffix}" >> "$GITHUB_OUTPUT"

      - name: "🔐 Verify release token"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN is required for this release workflow." >&2
            exit 1
          fi

          tap_remote="https://x-access-token:${RELEASE_TOKEN}@github.com/YunaBraska/homebrew-tap.git"
          git ls-remote "${tap_remote}" HEAD >/dev/null

          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT

          git -C "${probe_dir}" init -q
          git -C "${probe_dir}" config user.name "github-actions[bot]"
          git -C "${probe_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'release-token probe\n' > "${probe_dir}/README.md"
          git -C "${probe_dir}" add README.md
          git -C "${probe_dir}" commit -q -m "release-token probe"

          probe_ref="refs/heads/_release-token-probe-${GITHUB_RUN_ID}"
          git -C "${probe_dir}" push --dry-run "${tap_remote}" HEAD:"${probe_ref}" >/dev/null

      - name: "🧪 Checks and tests"
        run: sh scripts/check.sh

      - name: "🧹 Verify clean tree"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree changed during checks."
            git status --short
            exit 1
          fi

      - name: "🏗️ Build universal binary"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build-release-arm64 .build-release-x86_64 build/universal
          swift build -c release --arch arm64 --product PearchHA --scratch-path .build-release-arm64
          swift build -c release --arch x86_64 --product PearchHA --scratch-path .build-release-x86_64
          mkdir -p build/universal
          lipo -create \
            -output build/universal/PearchHA \
            .build-release-arm64/arm64-apple-macosx/release/PearchHA \
            .build-release-x86_64/x86_64-apple-macosx/release/PearchHA
          lipo -info build/universal/PearchHA

      - name: "📦 Package app bundle"
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"
          swift run pearchha-package-app \
            --executable build/universal/PearchHA \
            --output build/PearchHA.app \
            --callback-scheme pearchha \
            --replace \
            --version "${tag}" \
            --build-version "${tag}" \
            --sign-ad-hoc \
            --verify-signature \
            --package-dmg \
            --verify-dmg \
            --verify-dmg-contents \
            --release-manifest build/pearchha-release-manifest.json \
            --bundle-release-evidence build/pearchha-release-evidence \
            --snapshot-dir .build/pearchha-snapshots/current
          swift run pearchha-package-app \
            --verify-release-manifest build/pearchha-release-manifest.json

      - name: "🧾 Verify bundle metadata"
        shell: bash
        run: |
          set -euo pipefail
          plist="build/PearchHA.app/Contents/Info.plist"
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          b="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")"
          [[ "${v}" == "${{ steps.plan.outputs.tag }}" ]]
          [[ "${b}" == "${{ steps.plan.outputs.tag }}" ]]

      - name: "🧬 Verify universal binary"
        shell: bash
        run: |
          set -euo pipefail
          bin="build/PearchHA.app/Contents/MacOS/PearchHA"
          lipo -info "${bin}"
          lipo -info "${bin}" | grep -q "arm64"
          lipo -info "${bin}" | grep -q "x86_64"

      - name: "🪪 Verify code signature"
        run: codesign --verify --deep --verbose=2 build/PearchHA.app

      - name: "🗜️ Zip app bundle"
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -r --symlinks "PearchHA-${{ steps.plan.outputs.tag }}.zip" PearchHA.app
          cp PearchHA.dmg "PearchHA-${{ steps.plan.outputs.tag }}.dmg"

      - name: "🧮 Compute SHA256"
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          zip="build/PearchHA-${{ steps.plan.outputs.tag }}.zip"
          sha="$(shasum -a 256 "${zip}" | awk '{print $1}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: "🗃️ Upload release evidence"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pearchha-release-${{ steps.plan.outputs.artifact_suffix }}
          path: |
            build/PearchHA-${{ steps.plan.outputs.tag }}.zip
            build/PearchHA-${{ steps.plan.outputs.tag }}.dmg
            build/pearchha-release-manifest.json
            build/pearchha-release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: "🚀 Create GitHub release"
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: PearchHA ${{ steps.plan.outputs.tag }}
          body: |
            Automated build from ${{ github.sha }}.

            **Install:** download the DMG or zip below. The app is ad-hoc signed; right-click → **Open** on first launch if macOS warns.
          generate_release_notes: true
          files: |
            build/PearchHA-${{ steps.plan.outputs.tag }}.zip
            build/PearchHA-${{ steps.plan.outputs.tag }}.dmg
          draft: false
          prerelease: false

      - name: "🍺 Checkout Homebrew tap"
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          repository: YunaBraska/homebrew-tap
          token: ${{ env.RELEASE_TOKEN }}
          path: homebrew-tap

      - name: "🍺 Update Homebrew cask"
        if: ${{ steps.plan.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.tag }}"
          sha="${{ steps.sha.outputs.sha }}"

          cask="homebrew-tap/Casks/pearchha.rb"
          mkdir -p "$(dirname "${cask}")"
          cat > "${cask}" <<EOF
          cask "pearchha" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/YunaBraska/pearch_ha/releases/download/#{version}/PearchHA-#{version}.zip",
                verified: "github.com/YunaBraska/pearch_ha/"
            name "PearchHA"
            desc "macOS menu bar dashboard for Home Assistant"
            homepage "https://github.com/YunaBraska/pearch_ha"

            depends_on macos: ">= :ventura"

            app "PearchHA.app"
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pearchha.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git commit -m "pearchha: ${version}"
          git push
