name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (default: UTC date %Y.%m.%j%H%M)"
        required: false
        type: string
      dry_run:
        description: "Build and package without creating a GitHub release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: Verify native Xcode setup
        run: swift run perchha-xcode-doctor --json --strict

      - name: List XCTest cases
        run: swift test --disable-swift-testing --enable-xctest list

      - name: Plan release
        id: plan
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          publish=false
          dry_run=false

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish=true
          else
            dry_run="${INPUT_DRY_RUN}"
            if [[ "${dry_run}" != "true" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Non-dry-run manual releases must run from main." >&2
              exit 1
            fi
            if [[ "${dry_run}" != "true" ]]; then
              publish=true
            fi
          fi

          if [[ -n "${INPUT_VERSION}" ]]; then
            tag="${INPUT_VERSION}"
          else
            tag="$(date -u '+%Y.%m.%j%H%M')"
          fi

          if ! [[ "${tag}" =~ ^[0-9]{4}(\.[0-9]{1,4}){2,4}$ ]]; then
            echo "Release version must be numeric dot-separated, got: ${tag}" >&2
            exit 1
          fi

          if [[ "${publish}" == "true" ]]; then
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Release tag already exists: ${tag}" >&2
              exit 1
            fi
          fi

          artifact_suffix="${tag}"
          if [[ "${dry_run}" == "true" ]]; then
            artifact_suffix="${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_ID}"
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${artifact_suffix}" >> "$GITHUB_OUTPUT"

      - name: Checks and tests
        run: sh scripts/check.sh

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree changed during checks."
            git status --short
            exit 1
          fi

      - name: Build universal release binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"
          swift run perchha-package-app \
            --executable .build/apple/Products/Release/PerchHA \
            --output build/PerchHA.app \
            --callback-scheme perchha \
            --replace \
            --version "${tag}" \
            --build-version "${tag}" \
            --sign-ad-hoc \
            --verify-signature \
            --package-dmg \
            --verify-dmg \
            --verify-dmg-contents \
            --release-manifest build/perchha-release-manifest.json \
            --bundle-release-evidence build/perchha-release-evidence \
            --snapshot-dir .build/perchha-snapshots/current
          swift run perchha-package-app \
            --verify-release-manifest build/perchha-release-manifest.json

      - name: Verify bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          plist="build/PerchHA.app/Contents/Info.plist"
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          b="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")"
          [[ "${v}" == "${{ steps.plan.outputs.tag }}" ]]
          [[ "${b}" == "${{ steps.plan.outputs.tag }}" ]]

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail
          bin="build/PerchHA.app/Contents/MacOS/PerchHA"
          lipo -info "${bin}"
          lipo -info "${bin}" | grep -q "arm64"
          lipo -info "${bin}" | grep -q "x86_64"

      - name: Verify code signature
        run: codesign --verify --deep --verbose=2 build/PerchHA.app

      - name: Zip app bundle
        shell: bash
        run: |
          set -euo pipefail
          cd build
          zip -r --symlinks "PerchHA-${{ steps.plan.outputs.tag }}.zip" PerchHA.app
          cp PerchHA.dmg "PerchHA-${{ steps.plan.outputs.tag }}.dmg"

      - name: Compute SHA256 (for Homebrew)
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          zip="build/PerchHA-${{ steps.plan.outputs.tag }}.zip"
          sha="$(shasum -a 256 "${zip}" | awk '{print $1}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: perchha-release-${{ steps.plan.outputs.artifact_suffix }}
          path: |
            build/PerchHA-${{ steps.plan.outputs.tag }}.zip
            build/PerchHA-${{ steps.plan.outputs.tag }}.dmg
            build/perchha-release-manifest.json
            build/perchha-release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: PerchHA ${{ steps.plan.outputs.tag }}
          body: |
            Automated build from ${{ github.sha }}.

            **Install:** download the DMG or zip below. The app is ad-hoc signed; right-click → **Open** on first launch if macOS warns.
          generate_release_notes: true
          files: |
            build/PerchHA-${{ steps.plan.outputs.tag }}.zip
            build/PerchHA-${{ steps.plan.outputs.tag }}.dmg
          draft: false
          prerelease: false

      - name: Checkout Homebrew tap
        if: ${{ steps.plan.outputs.publish == 'true' && env.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: YunaBraska/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        if: ${{ steps.plan.outputs.publish == 'true' && env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.tag }}"
          sha="${{ steps.sha.outputs.sha }}"

          cask="homebrew-tap/Casks/perchha.rb"
          mkdir -p "$(dirname "${cask}")"
          cat > "${cask}" <<EOF
          cask "perchha" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/YunaBraska/pearch_ha/releases/download/#{version}/PerchHA-#{version}.zip",
                verified: "github.com/YunaBraska/pearch_ha/"
            name "PerchHA"
            desc "macOS menu bar dashboard for Home Assistant"
            homepage "https://github.com/YunaBraska/pearch_ha"

            depends_on macos: ">= :ventura"

            app "PerchHA.app"
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/perchha.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git commit -m "perchha: ${version}"
          git push
