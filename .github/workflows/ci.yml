name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: |
          swift --version
          xcodebuild -version
          xcrun --find xctest

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Repository safety audit
        run: |
          swift run perchha-repo-audit
          if swift run perchha-repo-audit --root --wat 2>&1 | rg -q "missing value for --root"; then
            echo "repo audit rejects missing root values before treating the next option as a path"
          else
            echo "expected --root missing value to fail explicitly"
            exit 1
          fi
          tmp="${TMPDIR:-/tmp}/perchha-repo-audit-$$"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          trap 'rm -rf "$tmp"' EXIT HUP INT TERM
          git -C "$tmp" init
          printf '%s\n' 'token=do-not-commit' > "$tmp/.env.local"
          git -C "$tmp" add -f .env.local
          if swift run perchha-repo-audit --root "$tmp"; then
            echo "expected local environment file audit to fail"
            exit 1
          fi
          rm -rf "$tmp"
          mkdir -p "$tmp/Fixtures/private"
          git -C "$tmp" init
          printf '%s\n' '{"private":true}' > "$tmp/Fixtures/private/capture.json"
          git -C "$tmp" add -f Fixtures/private/capture.json
          if swift run perchha-repo-audit --root "$tmp"; then
            echo "expected private fixture audit to fail"
            exit 1
          fi
          rm -rf "$tmp"
          mkdir -p "$tmp/.build"
          git -C "$tmp" init
          printf '%s\n' 'build output' > "$tmp/.build/output.txt"
          git -C "$tmp" add -f .build/output.txt
          if swift run perchha-repo-audit --root "$tmp"; then
            echo "expected build output audit to fail"
            exit 1
          fi
          rm -rf "$tmp"
          mkdir -p "$tmp/keys"
          git -C "$tmp" init
          printf '%s\n' 'private key' > "$tmp/keys/AuthKey_TEST.p8"
          git -C "$tmp" add -f keys/AuthKey_TEST.p8
          if swift run perchha-repo-audit --root "$tmp"; then
            echo "expected credential artifact audit to fail"
            exit 1
          fi

