name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, smoke, audit
    runs-on: macos-latest

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7.0.0

      - name: "🛠️ Select Xcode"
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: "🔎 Toolchain versions"
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: "🩺 Verify Xcode setup"
        run: swift run perchha-xcode-doctor --json --strict

      - name: "📋 List XCTest cases"
        run: swift test --disable-swift-testing --enable-xctest list

      - name: "🧪 Checks and tests"
        run: sh scripts/check.sh
        env:
          PERCHHA_TLS_DEBUG: "1"

      - name: "🧹 Verify clean tree"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree changed during checks."
            git status --short
            exit 1
          fi
